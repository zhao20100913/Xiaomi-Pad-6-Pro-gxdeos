# GXDE port overlay.  The upstream native image deliberately ships no
# autologin: with no human account it boots into gnome-initial-setup, which
# creates the user.  GXDE has no initial-setup flow, so the port provisions the
# tablet account at build time and logs it straight into the GXDE session.
#
# WaylandEnable=false matters here: the GXDE session stack (kwin-x11,
# dde-daemon, gxde-dock) is an X11 desktop, while gdm3 would otherwise default
# to its Wayland greeter and could start a Wayland GXDE session that the stack
# does not support.
[daemon]
AutomaticLoginEnable=true
AutomaticLogin=liuqin
TimedLoginEnable=false
WaylandEnable=false
