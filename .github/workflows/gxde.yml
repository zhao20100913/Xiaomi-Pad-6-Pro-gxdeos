name: GXDE OS (liuqin)
# Entry point: docs/GXDE.md
# Build the GXDE OS port for the Xiaomi Pad 6 Pro (liuqin).
#
#   kernel       the locked mainline kernel (public, hosted runner)
#   gxde-rootfs  Debian 13 trixie + GXDE desktop + gdm3, arm64 root built under
#                qemu on a hosted runner (public inputs only: no stock dump)
#   image        the flashable bundle: installs the stock-built device layer
#                into that root and assembles boot.img/installer.img/
#                rootfs.tar.gz (self-hosted runner that owns the stock inputs)
#
# The image job is gated exactly like the upstream image workflow: it only runs
# trusted main code and only on a runner with the prepared stock inputs, because
# the sensor stack, fingerprint provider and stock DTBs are not redistributable.
on:
  workflow_dispatch:
    inputs:
      gxde_mirror:
        description: GXDE package mirror
        required: false
        default: https://repo.gxde.top/gxde-os/lizhi
      gxde_source_sha256:
        description: Optional sha256 pin for gxde-source_1.1.11_all.deb
        required: false
        default: ''
      install_spark_store:
        description: Install spark-store (GXDE app store, ~85 MB)
        type: boolean
        required: false
        default: false
      kernel_run_id:
        description: Reuse the kernel artifact of this run id instead of rebuilding it
        required: false
        default: ''
      rootfs_run_id:
        description: Reuse the GXDE root of this run id instead of rebuilding it
        required: false
        default: ''
      build_image:
        description: Also assemble the flashable bundle (downloads the ROM, ~7 GB)
        type: boolean
        required: false
        default: false
      image_stages:
        description: Stages of tools/gxde/build-gxde-image.sh to run (space separated)
        required: false
        default: tools stock pool wlan topology sensors modules debs device boot bundle
      rom_url:
        description: Fastboot ROM archive used for the sensor stack and WLAN blobs
        required: false
        default: https://bkt-sgp-miui-ota-update-alisgp.oss-ap-southeast-1.aliyuncs.com/OS2.0.6.0.VMYCNXM/liuqin_images_OS2.0.6.0.VMYCNXM_20250318.0000.00_15.0_cn_c29f6de5df.tgz
  push:
    branches: [main]
    paths:
      - 'tools/gxde/**'
      - 'device/gxde-overlay/**'
      - 'tools/build-liuqin-debs.sh'
      - 'kernel/source.json'
      - '.github/workflows/gxde.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: gxde-${{ github.ref }}
  cancel-in-progress: false

jobs:
  kernel:
    if: inputs.kernel_run_id == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    outputs:
      sha: ${{ steps.kernel.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: project
          persist-credentials: false
      - name: Kernel revision
        id: kernel
        run: |
          python3 - <<'PY'
          import json, os
          sha = json.load(open('project/kernel/source.json'))['commit']
          with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
              stream.write('sha=' + sha + '\n')
          PY
      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential bc bison flex libssl-dev libelf-dev libdrm-dev \
            python3 git ccache kmod rsync zip \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu libc6-dev-arm64-cross
      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.LIUQIN_KERNEL_REPO || 'yzddmr6/linux-sm8450-liuqin' }}
          ref: ${{ steps.kernel.outputs.sha }}
          path: linux-sm8450-liuqin
          fetch-depth: 0
          persist-credentials: false
      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: gxde-kernel-ccache-${{ steps.kernel.outputs.sha }}
          restore-keys: gxde-kernel-ccache-
      - name: Build the locked kernel
        working-directory: project
        env:
          CCACHE_DIR: ~/.ccache
        run: python3 tools/build-liuqin-kernel.py --jobs 8
      - name: Record kernel identity
        run: |
          cat project/out/kernel/build-info.json
          (cd project/out/kernel && sha256sum -c --quiet SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: gxde-kernel-${{ github.sha }}
          if-no-files-found: error
          include-hidden-files: true
          compression-level: 1
          retention-days: 7
          path: |
            project/out/kernel/arch/arm64/boot/Image
            project/out/kernel/arch/arm64/boot/dts/qcom/sm8475-xiaomi-liuqin.dtb
            project/out/kernel/modules/
            project/out/kernel/.config
            project/out/kernel/build-info.json
            project/out/kernel/SHA256SUMS
            project/out/kernel/include/config/kernel.release
            project/out/kernel/scripts/dtc/

  gxde-rootfs:
    # A skipped kernel (artifact reuse) must still run this job.
    needs: kernel
    if: always() && needs.kernel.result != 'cancelled' && inputs.rootfs_run_id == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h /
      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            mmdebstrap arch-test debian-archive-keyring zstd qemu-user-static \
            binfmt-support \
            python3 curl ca-certificates
          ls -l /proc/sys/fs/binfmt_misc/qemu-aarch64
      - name: Fetch the kernel artifact of this run
        if: inputs.kernel_run_id == ''
        uses: actions/download-artifact@v4
        with:
          name: gxde-kernel-${{ github.sha }}
          path: out/kernel-dl
      - name: Fetch the kernel artifact of an earlier run
        if: inputs.kernel_run_id != ''
        uses: actions/download-artifact@v4
        with:
          pattern: gxde-kernel-*
          run-id: ${{ inputs.kernel_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: out/kernel-dl
      - name: Lay the kernel artifact out
        run: |
          # upload-artifact strips the least common ancestor (project/out/kernel),
          # and a pattern download adds one directory per artifact.
          src=out/kernel-dl
          [ -d "$src/arch" ] || src=$(find out/kernel-dl -maxdepth 2 -type d -name 'gxde-kernel-*' | head -n 1)
          test -f "$src/arch/arm64/boot/Image" || { echo 'no arm64 Image in the kernel artifact'; exit 1; }
          mkdir -p out/kernel
          cp -a "$src"/. out/kernel/
          test -f out/kernel/include/config/kernel.release
          ls out/kernel
      - name: Bootstrap Debian trixie arm64
        env:
          GXDE_MIRROR: ${{ inputs.gxde_mirror || 'https://repo.gxde.top/gxde-os/lizhi' }}
          GXDE_SOURCE_SHA256: ${{ inputs.gxde_source_sha256 }}
          GXDE_INSTALL_SPARK_STORE: ${{ inputs.install_spark_store && '1' || '0' }}
          KERNEL_MODULES_DIR: ${{ github.workspace }}/out/kernel/modules
          OUT_DIR: ${{ github.workspace }}/out/gxde
        run: sudo -E tools/gxde/build-gxde-rootfs.sh bootstrap
      - name: Install the GXDE desktop
        env:
          GXDE_MIRROR: ${{ inputs.gxde_mirror || 'https://repo.gxde.top/gxde-os/lizhi' }}
          GXDE_SOURCE_SHA256: ${{ inputs.gxde_source_sha256 }}
          GXDE_INSTALL_SPARK_STORE: ${{ inputs.install_spark_store && '1' || '0' }}
          KERNEL_MODULES_DIR: ${{ github.workspace }}/out/kernel/modules
          OUT_DIR: ${{ github.workspace }}/out/gxde
        run: sudo -E tools/gxde/build-gxde-rootfs.sh desktop
      - name: Install the liuqin device layer
        env:
          GXDE_MIRROR: ${{ inputs.gxde_mirror || 'https://repo.gxde.top/gxde-os/lizhi' }}
          GXDE_SOURCE_SHA256: ${{ inputs.gxde_source_sha256 }}
          GXDE_INSTALL_SPARK_STORE: ${{ inputs.install_spark_store && '1' || '0' }}
          KERNEL_MODULES_DIR: ${{ github.workspace }}/out/kernel/modules
          OUT_DIR: ${{ github.workspace }}/out/gxde
        run: sudo -E tools/gxde/build-gxde-rootfs.sh device
      - name: Assemble the boot contract
        env:
          GXDE_MIRROR: ${{ inputs.gxde_mirror || 'https://repo.gxde.top/gxde-os/lizhi' }}
          GXDE_SOURCE_SHA256: ${{ inputs.gxde_source_sha256 }}
          GXDE_INSTALL_SPARK_STORE: ${{ inputs.install_spark_store && '1' || '0' }}
          KERNEL_MODULES_DIR: ${{ github.workspace }}/out/kernel/modules
          OUT_DIR: ${{ github.workspace }}/out/gxde
        run: sudo -E tools/gxde/build-gxde-rootfs.sh assemble
      - name: Check the assembled root
        env:
          GXDE_MIRROR: ${{ inputs.gxde_mirror || 'https://repo.gxde.top/gxde-os/lizhi' }}
          GXDE_SOURCE_SHA256: ${{ inputs.gxde_source_sha256 }}
          GXDE_INSTALL_SPARK_STORE: ${{ inputs.install_spark_store && '1' || '0' }}
          KERNEL_MODULES_DIR: ${{ github.workspace }}/out/kernel/modules
          OUT_DIR: ${{ github.workspace }}/out/gxde
        run: sudo -E tools/gxde/build-gxde-rootfs.sh check
      - name: Write the root manifest
        env:
          GXDE_MIRROR: ${{ inputs.gxde_mirror || 'https://repo.gxde.top/gxde-os/lizhi' }}
          GXDE_SOURCE_SHA256: ${{ inputs.gxde_source_sha256 }}
          GXDE_INSTALL_SPARK_STORE: ${{ inputs.install_spark_store && '1' || '0' }}
          KERNEL_MODULES_DIR: ${{ github.workspace }}/out/kernel/modules
          OUT_DIR: ${{ github.workspace }}/out/gxde
        run: sudo -E tools/gxde/build-gxde-rootfs.sh manifest
      - name: Pack the root
        env:
          GXDE_MIRROR: ${{ inputs.gxde_mirror || 'https://repo.gxde.top/gxde-os/lizhi' }}
          GXDE_SOURCE_SHA256: ${{ inputs.gxde_source_sha256 }}
          GXDE_INSTALL_SPARK_STORE: ${{ inputs.install_spark_store && '1' || '0' }}
          KERNEL_MODULES_DIR: ${{ github.workspace }}/out/kernel/modules
          OUT_DIR: ${{ github.workspace }}/out/gxde
        run: sudo -E tools/gxde/build-gxde-rootfs.sh pack
      - name: Upload the root
        uses: actions/upload-artifact@v4
        with:
          name: gxde-rootfs-${{ github.sha }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
          path: |
            out/gxde/rootfs.tar.zst
            out/gxde/rootfs.tar.zst.sha256
            out/gxde/gxde-rootfs.manifest
            out/gxde/gxde-rootfs.hashes
            out/gxde/gxde-rootfs.identity

  image:
    # Hosted, fully public pipeline: the ROM supplies the exact sensor stack and
    # the four WLAN blobs; everything else is rebuilt from this repository and
    # public sources. Manual dispatch only, because it downloads a 7 GB archive
    # and repacks a 9 GB root.
    needs: [kernel, gxde-rootfs]
    # always() is required: without it a skipped dependency silently skips this
    # job as well, which is exactly the reuse mode (kernel_run_id/rootfs_run_id).
    if: >-
      always() && github.event_name == 'workflow_dispatch' && inputs.build_image &&
      (needs.gxde-rootfs.result == 'success' || inputs.rootfs_run_id != '')
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          path: project
          persist-credentials: false
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc             /opt/hostedtoolcache/CodeQL /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h /
      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            qemu-user-static binfmt-support debootstrap mmdebstrap arch-test \
            debian-archive-keyring zstd squashfs-tools erofs-utils cpio gdisk \
            e2fsprogs android-sdk-libsparse-utils file jq m4 alsa-utils acl attr \
            build-essential bc bison flex libssl-dev libelf-dev libdrm-dev \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu libc6-dev-arm64-cross \
            python3-pyelftools
          ls -l /proc/sys/fs/binfmt_misc/qemu-aarch64
      - name: Fetch the kernel build
        if: inputs.kernel_run_id == ''
        uses: actions/download-artifact@v4
        with:
          name: gxde-kernel-${{ github.sha }}
          path: out/kernel-dl
      - name: Fetch the kernel build of an earlier run
        if: inputs.kernel_run_id != ''
        uses: actions/download-artifact@v4
        with:
          pattern: gxde-kernel-*
          run-id: ${{ inputs.kernel_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: out/kernel-dl
      - name: Lay out the kernel build
        run: |
          test -d out/kernel-dl || {
            echo 'the selected run has no gxde-kernel-* artifact (a run that reused its kernel has none)'
            exit 1
          }
          # upload-artifact strips the least common ancestor (project/out/kernel),
          # and a pattern download adds one directory per artifact.
          src=out/kernel-dl
          [ -d "$src/arch" ] || src=$(find out/kernel-dl -maxdepth 2 -type d -name 'gxde-kernel-*' | head -n 1)
          test -f "$src/arch/arm64/boot/Image" || { echo 'no arm64 Image in the kernel artifact'; exit 1; }
          mkdir -p out/kernel
          cp -a "$src"/. out/kernel/
          test -f out/kernel/include/config/kernel.release
          ls out/kernel
      - name: Fetch the GXDE root
        if: inputs.rootfs_run_id == ''
        uses: actions/download-artifact@v4
        with:
          name: gxde-rootfs-${{ github.sha }}
          path: out/rootfs-dl
      - name: Fetch the GXDE root of an earlier run
        if: inputs.rootfs_run_id != ''
        uses: actions/download-artifact@v4
        with:
          pattern: gxde-rootfs-*
          run-id: ${{ inputs.rootfs_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: out/rootfs-dl
      - name: Unpack the root
        run: |
          archive=$(find out/rootfs-dl -name rootfs.tar.zst | head -n 1)
          test -n "$archive"
          mkdir -p project/out/gxde/root
          sudo tar -I zstd -xf "$archive" -C project/out/gxde/root
          sudo test -x project/out/gxde/root/usr/lib/systemd/systemd
      - name: Read the locked kernel revision
        id: kernel-ref
        run: |
          echo "sha=$(python3 -c 'import json;print(json.load(open("project/kernel/source.json"))["commit"])')" >>"$GITHUB_OUTPUT"
      # A full clone of the kernel branch takes minutes; the pinned commit is
      # all this job needs, so fetch exactly it.
      - name: Check out the locked kernel revision
        run: |
          set -eux
          repo="${{ vars.LIUQIN_KERNEL_REPO || 'yzddmr6/linux-sm8450-liuqin' }}"
          sha="${{ steps.kernel-ref.outputs.sha }}"
          git init -q linux-sm8450-liuqin
          cd linux-sm8450-liuqin
          git remote add origin "https://github.com/$repo"
          git fetch -q --depth=1 origin "$sha"
          git checkout -q --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$sha"
      - name: Cache the stock inputs and the sensor stack
        uses: actions/cache@v4
        with:
          path: |
            project/out/gxde/stock/rom-sensors
            project/out/gxde/sensors
          key: gxde-stock-sensors-${{ hashFiles('tools/build-liuqin-sensors-stack.sh', 'tools/gxde/prepare-stock-inputs.py', 'device/sensors-overlay/**') }}

      - name: Download the fastboot ROM
        env:
          ROM_URL: ${{ inputs.rom_url }}
        run: |
          mkdir -p out/rom
          curl -fL --retry 3 --retry-delay 5 --connect-timeout 30 \
            -o out/rom/rom.tgz "$ROM_URL"
          ls -l out/rom/rom.tgz
      - name: Assemble the flashable bundle
        env:
          OUT_DIR: ${{ github.workspace }}/project/out/gxde
          GXDE_ROOT: ${{ github.workspace }}/project/out/gxde/root
          KERNEL_SOURCE: ${{ github.workspace }}/linux-sm8450-liuqin
          KERNEL_OUT: ${{ github.workspace }}/out/kernel
          ROM: ${{ github.workspace }}/out/rom/rom.tgz
          JOBS: 8
          STAGES: ${{ inputs.image_stages }}
        run: |
          # shellcheck disable=SC2086
          sudo -E sh project/tools/gxde/build-gxde-image.sh $STAGES
      - name: Locate the stock WLAN blobs
        if: failure()
        run: |
          set -ux
          rm -rf /tmp/locate
          mkdir -p /tmp/locate
          tar xzf out/rom/rom.tgz -C /tmp/locate --strip-components=2 \
            --wildcards '*/images/cust.img' '*/images/vm-bootsys.img' \
            '*/images/vendor_boot.img' || true
          file /tmp/locate/*.img || true
          python3 project/tools/gxde/prepare-stock-inputs.py locate \
            project/out/gxde/stock/work/super.raw \
            /tmp/locate/cust.img /tmp/locate/vm-bootsys.img \
            /tmp/locate/vendor_boot.img \
            --names amss20.bin m3.bin regdb.bin bd_m81gf.elf || true
      - name: Upload the bundle
        if: hashFiles('project/out/gxde/bundle/bundle.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: gxde-bundle-${{ github.sha }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
          path: project/out/gxde/bundle/
      - name: Upload the intermediate trees on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gxde-image-debug-${{ github.sha }}
          if-no-files-found: ignore
          compression-level: 1
          retention-days: 3
          # Keep the debug artifact small: the extracted super image alone is
          # 9 GB and only the derived inputs are interesting.
          path: |
            project/out/gxde/stock/rom-sensors/
            project/out/gxde/stock/wlan-vendor/
            project/out/gxde/stock/inputs.json
            project/out/gxde/wlan/
            project/out/gxde/topology/
