name: Stock ROM probe
# Development probe: download the liuqin fastboot ROM, unpacks its super image
# and reports where the files the device layer needs actually live.  Delete it
# once tools/gxde/prepare-stock-inputs.py covers the whole extraction.
on:
  workflow_dispatch:
    inputs:
      rom_url:
        description: Fastboot ROM URL
        required: false
        default: https://bkt-sgp-miui-ota-update-alisgp.oss-ap-southeast-1.aliyuncs.com/OS2.0.6.0.VMYCNXM/liuqin_images_OS2.0.6.0.VMYCNXM_20250318.0000.00_15.0_cn_c29f6de5df.tgz
permissions:
  contents: read
concurrency:
  group: stock-probe
  cancel-in-progress: true
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h /
      - name: Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            e2fsprogs erofs-utils file jq
          df -h /
      - name: Download the ROM
        env:
          ROM_URL: ${{ inputs.rom_url }}
        run: |
          curl -fL --retry 3 --retry-delay 5 --connect-timeout 30 --silent --show-error -o rom.tgz "$ROM_URL"
          ls -l rom.tgz
      - name: Extract the images
        run: |
          mkdir -p rom
          tar xzvf rom.tgz -C rom --strip-components=2 --wildcards \
            '*/images/super.img' '*/images/NON-HLOS.bin' '*/images/BTFM.bin' '*/images/dtbo.img'
          ls -l rom/ | tee report.txt
          file rom/* | tee -a report.txt
      - name: Prepare the stock inputs
        run: |
          set -x
          python3 tools/gxde/prepare-stock-inputs.py probe rom/super.img | tee -a report.txt || true
          python3 tools/gxde/prepare-stock-inputs.py prepare --super rom/super.img --out stock 2>&1 | tee -a report.txt || true
          find stock -type f -printf '%s  %p\n' | LC_ALL=C sort -k2 | tee -a report.txt | tail -40
          sha256sum stock/rom-sensors/etc/sensors/sns_reg_config 2>/dev/null | tee -a report.txt || true
          ls stock/rom-sensors/etc/sensors/config 2>/dev/null | wc -l | tee -a report.txt || true
      - name: Keep the metadata head
        run: |
          head -c 24576 super.raw > super.head.bin
          head -c 24576 rom/super.img > super.sparse.head.bin 2>/dev/null || true
          ls -l super.head.bin super.sparse.head.bin 2>/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: stock-probe-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 3
          path: |
            report.txt
            super.head.bin
            super.sparse.head.bin
            stock/rom-sensors
            stock/wlan-vendor
