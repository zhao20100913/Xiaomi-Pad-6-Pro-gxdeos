name: Stock ROM probe
# Development probe: download the liuqin fastboot ROM, unpacks its super image
# and reports where the files the device layer needs actually live.  Delete it
# once tools/gxde/prepare-stock-inputs.py covers the whole extraction.
on:
  workflow_dispatch:
    inputs:
      rom_url:
        description: Fastboot ROM URL
        required: false
        default: https://bkt-sgp-miui-ota-update-alisgp.oss-ap-southeast-1.aliyuncs.com/OS2.0.6.0.VMYCNXM/liuqin_images_OS2.0.6.0.VMYCNXM_20250318.0000.00_15.0_cn_c29f6de5df.tgz
permissions:
  contents: read
concurrency:
  group: stock-probe
  cancel-in-progress: true
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h /
      - name: Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            e2fsprogs erofs-utils file jq
          df -h /
      - name: Download the ROM
        env:
          ROM_URL: ${{ inputs.rom_url }}
        run: |
          curl -fL --retry 3 --retry-delay 5 --connect-timeout 30 --silent --show-error -o rom.tgz "$ROM_URL"
          ls -l rom.tgz
      - name: Extract the images
        run: |
          mkdir -p rom
          tar xzvf rom.tgz -C rom --strip-components=2 --wildcards \
            '*/images/super.img' '*/images/NON-HLOS.bin' '*/images/BTFM.bin' '*/images/dtbo.img'
          ls -l rom/ | tee report.txt
          file rom/* | tee -a report.txt
      - name: Unpack super
        run: |
          set -x
          python3 tools/gxde/prepare-stock-inputs.py unsparse rom/super.img super.raw
          ls -l super.raw
          python3 tools/gxde/prepare-stock-inputs.py probe super.raw | tee -a report.txt
      - name: Dump the partitions
        run: |
          set -x
          python3 tools/gxde/prepare-stock-inputs.py unpack super.raw parts vendor vendor_a 2>&1 | tee -a report.txt || true
          for image in parts/*.img; do
            echo "== $image ($(stat -c%s "$image") bytes)" | tee -a report.txt
            if python3 tools/gxde/prepare-stock-inputs.py fs-tree "$image" / 2>&1 | head -40; then :; fi | tee -a report.txt
          done
      - name: Look for the device-layer files
        run: |
          set +e
          vendor=$(ls parts/vendor_a.img parts/vendor.img 2>/dev/null | head -1)
          echo "vendor image: $vendor" | tee -a report.txt
          for path in /etc/sensors /firmware /firmware/novatek /firmware/qca /lib/firmware; do
            echo "== vendor $path" | tee -a report.txt
            python3 tools/gxde/prepare-stock-inputs.py fs-tree "$vendor" "$path" 2>&1 | head -30 | tee -a report.txt
          done
          for image in rom/NON-HLOS.bin rom/BTFM.bin; do
            for path in / /image; do
              echo "== $image $path" | tee -a report.txt
              python3 tools/gxde/prepare-stock-inputs.py fs-tree "$image" "$path" 2>&1 | head -40 | tee -a report.txt
            done
          done
      - name: Keep the metadata head
        run: |
          head -c 24576 super.raw > super.head.bin
          head -c 24576 rom/super.img > super.sparse.head.bin 2>/dev/null || true
          ls -l super.head.bin super.sparse.head.bin 2>/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: stock-probe-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 3
          path: |
            report.txt
            super.head.bin
            super.sparse.head.bin
