name: probe-a
on:
  workflow_dispatch:
    inputs:
      gxde_mirror:
        description: GXDE package mirror
        required: false
        default: https://repo.gxde.top/gxde-os/lizhi
      gxde_source_sha256:
        description: Optional sha256 pin for gxde-source_1.1.11_all.deb
        required: false
        default: ''
      install_spark_store:
        description: Install spark-store (GXDE app store, ~85 MB)
        type: boolean
        required: false
        default: false
      build_image:
        description: Also assemble the flashable bundle (needs the self-hosted runner)
        type: boolean
        required: false
        default: false
  push:
    branches: [main]
    paths:
      - 'tools/gxde/**'
      - 'device/gxde-overlay/**'
      - 'tools/build-liuqin-debs.sh'
      - 'kernel/source.json'
      - '.github/workflows/gxde.yml'
permissions:
  contents: read
concurrency:
  group: gxde-${{ github.ref }}
  cancel-in-progress: false
jobs:
  kernel:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    outputs:
      sha: ${{ steps.kernel.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: project
          persist-credentials: false
      - name: Kernel revision
        id: kernel
        run: |
          python3 - <<'PY'
          import json, os
          sha = json.load(open('project/kernel/source.json'))['commit']
          with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
              stream.write('sha=' + sha + '\n')
          PY
      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential bc bison flex libssl-dev libelf-dev libdrm-dev \
            python3 git ccache kmod rsync zip \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu libc6-dev-arm64-cross
      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.LIUQIN_KERNEL_REPO || format('{0}/linux-sm8450-liuqin', github.repository_owner) }}
          ref: ${{ steps.kernel.outputs.sha }}
          path: linux-sm8450-liuqin
          fetch-depth: 0
          persist-credentials: false
      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: gxde-kernel-ccache-${{ steps.kernel.outputs.sha }}
          restore-keys: gxde-kernel-ccache-
      - name: Build the locked kernel
        working-directory: project
        env:
          CCACHE_DIR: ~/.ccache
        run: python3 tools/build-liuqin-kernel.py --jobs 8
      - name: Record kernel identity
        run: |
          cat project/out/kernel/build-info.json
          (cd project/out/kernel && sha256sum -c --quiet SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: gxde-kernel-${{ github.sha }}
          if-no-files-found: error
          compression-level: 1
          retention-days: 7
          path: |
            project/out/kernel/arch/arm64/boot/Image
            project/out/kernel/arch/arm64/boot/dts/qcom/sm8475-xiaomi-liuqin.dtb
            project/out/kernel/modules/
            project/out/kernel/.config
            project/out/kernel/build-info.json
            project/out/kernel/SHA256SUMS
            project/out/kernel/include/config/kernel.release
            project/out/kernel/scripts/dtc/
